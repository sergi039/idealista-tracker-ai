# Container names, host ports, the network and the data volume are all GLOBAL
# Docker resources: unlike everything Compose scopes by project name, a
# hard-coded `container_name` is claimed process-wide. A second checkout (a git
# worktree, a branch build) running `docker compose up` therefore steals the
# production container's name and blocks the deploy watcher with
# "Conflict. The container name /idealista-app is already in use", and it would
# have written into the production database volume on the way there.
#
# So every global name is derived from one variable. Leave it unset - as the
# main checkout does - and this file renders exactly the production names and
# ports below. In a worktree, set them in that worktree's .env:
#
#   COMPOSE_CONTAINER_PREFIX=wt1
#   APP_HOST_PORT=5101
#   DB_HOST_PORT=5534
#
# See docs/DEV_RULES.md. APP_HOST_PORT is the HOST side only; the app always
# listens on 5001 inside the container (Dockerfile CMD), which is why the
# container port stays literal.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_CONTAINER_PREFIX:-idealista}-app
    ports:
      # Loopback-only by contract (there is no authentication) - never widen it.
      - "127.0.0.1:${APP_HOST_PORT:-5001}:5001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-idealista}:${DB_PASSWORD}@db:5432/${DB_NAME:-idealista_universal}
      # The cache asked for 30 days and got the lifetime of a process (#356):
      # without this, utils/cache.py falls back to SimpleCache and every run -
      # every deploy restart, every `docker exec`, every `compose run` sibling -
      # re-pays Overpass for coastline cells the last one already fetched.
      # Overridable so an external Redis can be pointed at instead.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Fail-closed on purpose. config.py already defaults this to false outside
      # DEV_MODE; a `:-true` here overrode that for every container built from
      # this file, which is how a dev checkout came to poll the same mailbox as
      # the deployment - two divergent databases and a second Google bill per
      # listing (#376). The machine that IS the deployment says so in its .env.
      - AUTO_START_SCHEDULER=${AUTO_START_SCHEDULER:-false}
      # AI runs on the owner's subscriptions via the host bridge, never on API keys.
      - AI_BRIDGE_URL=${AI_BRIDGE_URL:-http://host.docker.internal:5061}
    extra_hosts:
      # Linux hosts need this mapping; Docker Desktop provides it natively.
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist last seen UID
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - idealista-network

  db:
    image: postgres:15-alpine
    container_name: ${COMPOSE_CONTAINER_PREFIX:-idealista}-db
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-idealista_universal}
      POSTGRES_USER: ${DB_USER:-idealista}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_universal:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-idealista} -d ${DB_NAME:-idealista_universal}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - idealista-network

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_CONTAINER_PREFIX:-idealista}-redis
    # No published port, deliberately. Only the app, a `docker exec` and a
    # `compose run` sibling need it and they reach it over this network. This
    # stack has no authentication (see CLAUDE.md), so nothing gets a host
    # binding it does not need.
    command:
      - redis-server
      # The point of the ticket is surviving a process, so the data has to
      # survive the container too - otherwise a redis restart re-pays Overpass
      # for every cell exactly as SimpleCache did.
      - --appendonly
      - "yes"
      # Bounded rather than unbounded: coastline geometry is the big payload,
      # and an unbounded cache on a shared machine is a memory leak with a TTL.
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      # volatile-lru, not allkeys-lru: it evicts only keys that carry a TTL.
      # Every key this app writes has one - cache entries and flask-limiter
      # counters alike - so nothing is immortal, and a key without a TTL is a
      # bug that will be noticed rather than silently discarded.
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - idealista-network

volumes:
  pgdata_universal:
    # Prefixed for the same reason as the containers: an unscoped volume name
    # means a branch build runs its migrations against the production data.
    name: ${COMPOSE_CONTAINER_PREFIX:-idealista}-universal-pgdata
  redisdata:
    # Prefixed for the same reason: a branch build must not inherit - or
    # poison - the production cache, which now lives for 30 days.
    name: ${COMPOSE_CONTAINER_PREFIX:-idealista}-redis-data

networks:
  idealista-network:
    name: ${COMPOSE_CONTAINER_PREFIX:-idealista}-network
