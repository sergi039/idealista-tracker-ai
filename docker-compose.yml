services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idealista-app
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-idealista}:${DB_PASSWORD}@db:5432/${DB_NAME:-idealista_universal}
      - AUTO_START_SCHEDULER=${AUTO_START_SCHEDULER:-true}
      # AI runs on the owner's subscriptions via the host bridge, never on API keys.
      - AI_BRIDGE_URL=${AI_BRIDGE_URL:-http://host.docker.internal:5061}
    extra_hosts:
      # Linux hosts need this mapping; Docker Desktop provides it natively.
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist last seen UID
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - idealista-network

  db:
    image: postgres:15-alpine
    container_name: idealista-db
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-idealista_universal}
      POSTGRES_USER: ${DB_USER:-idealista}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_universal:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-idealista} -d ${DB_NAME:-idealista_universal}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - idealista-network

volumes:
  pgdata_universal:
    name: idealista-universal-pgdata

networks:
  idealista-network:
    name: idealista-network
