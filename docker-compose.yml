services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idealista-app
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-idealista}:${DB_PASSWORD}@db:5432/${DB_NAME:-idealista_universal}
    command: >
      gunicorn --bind 0.0.0.0:5001 --workers 1 --threads 4 main:app
    volumes:
      # Persist last seen UID
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - idealista-network

  db:
    image: postgres:15-alpine
    container_name: idealista-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-idealista_universal}
      POSTGRES_USER: ${DB_USER:-idealista}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_universal:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-idealista} -d ${DB_NAME:-idealista_universal}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - idealista-network

volumes:
  pgdata_universal:
    name: idealista-universal-pgdata

networks:
  idealista-network:
    name: idealista-network
