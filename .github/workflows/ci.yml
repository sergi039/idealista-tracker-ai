name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Everything in migrations/ is PostgreSQL-only and multi-statement, which
    # pysqlite refuses outright, so the SQLite tests can only cover migrations
    # that are never executed (the frozen 000-012 baseline). Without a real
    # server, tests/test_postgres_migrations.py would skip and migration SQL
    # would first run in production - which is where migration 013 would have
    # died on a psycopg2 percent-sign collision (issue #102).
    #
    # Pinned by tag, matching docker-compose.yml, because the digest could not
    # be verified for linux/amd64 from the authoring machine and a wrong one
    # would wedge this required check. Worth pinning by digest once verified.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: idealista_ci
          POSTGRES_PASSWORD: idealista_ci
          POSTGRES_DB: idealista_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idealista_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL_POSTGRES: postgresql://idealista_ci:idealista_ci@127.0.0.1:5432/idealista_ci
      # A server that never came up must fail the job, never quietly turn the
      # only tests that execute migration SQL into skips.
      REQUIRE_POSTGRES_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv + Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest tests/ -v

  lint:
    # Lint gate that does not depend on anyone's local setup (issue #81).
    # Until now the only thing enforcing ruff was a PostToolUse hook in an
    # untracked .claude/settings.json on one Mac: it misses every author
    # that does not edit through that tool (codex/* branches, the GitHub web
    # editor, a fresh clone) and the pre-push hook is opt-in per clone.
    #
    # Same commands as tools/ci/local_ci.sh steps 1-2, run through the same
    # uv + Python 3.11 setup as the pytest job, so `uv run ruff ...` locally
    # reproduces a red run exactly - including the ruff version, which comes
    # from uv.lock rather than from PATH.
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv + Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      # Reported even when the step above failed, so one run shows every
      # problem instead of one class per push (same rationale as local_ci.sh).
      - name: ruff format --check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

  bundles:
    name: no-source-bundles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject committed archives and source dumps
        run: |
          hits=$(git ls-files -- '*.zip' '*.tar.gz' '*.tgz' '*all_code.txt')
          if [ -n "$hits" ]; then
            echo "::error::Source bundles must never be committed (issue #29):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no source bundles tracked"
