[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Universal Idealista tracker and AI analyzer (email-driven)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.66.0",
    "apscheduler>=3.11.0",
    "defusedcsv>=3.0.0",
    "email-validator>=2.3.0",
    "flask-caching>=2.3.1",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-limiter[redis]>=3.5.0",
    "flask-wtf>=1.2.1",
    "google-api-python-client>=2.181.0",
    "google-auth>=2.40.3",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "gunicorn>=23.0.0",
    "imapclient>=3.0.1",
    "protobuf>=6.33.5",
    "psycopg2-binary>=2.9.10",
    "pyasn1>=0.6.2",
    "requests>=2.32.5",
    "urllib3>=2.6.3",
    "sqlalchemy>=2.0.43",
    "trafilatura>=2.0.0",
    "werkzeug>=3.1.6",
    "redis>=6.4.0",
    "puremagic>=1.30",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8.4.2",
    "pytest-flask>=1.3.0",
    # Locked (uv.lock) so `uv run ruff` means one exact version for the CI
    # lint job, tools/ci/local_ci.sh and the pre-push hook alike, instead of
    # whatever each machine happens to have on PATH (issue #81).
    "ruff>=0.16.2",
]

[tool.ruff.lint]
# Ruff's *default* rule set is not stable across releases: 0.15.x enabled 59
# rules (the classic E4/E7/E9/F), 0.16.0 widened the default to 413, which
# reports 1077 findings on this repository. Without an explicit selection the
# lint gate would therefore pass or fail depending on which ruff each author
# installed - the exact non-determinism the CI job exists to remove (#81).
#
# This list is the set the repository is actually clean under today. Widening
# it is real work with semantic consequences - the 1077 findings above are
# mostly UP* annotations plus BLE001/S110 exception handling - and belongs in
# its own issue, not in the one that only turns the gate on.
select = ["E4", "E7", "E9", "F"]
